name: Offline provider budget checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  provider-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest
      - name: Install the exact provider used by Unfold
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from unfold.agent import PROVIDERS
          source = 'git+https://github.com/microsoft/amplifier-module-provider-openai@'
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
              'amplifier-module-provider-openai @ ' + source + PROVIDERS['openai'][0]])
          PY
      - name: Verify request bounds and worker cleanup without API access
        run: python -m pytest -q -rs tests/test_provider_budget.py
